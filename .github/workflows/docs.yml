# Publie le site de documentation (docs/, VitePress) sur GitHub Pages : https://ebonyframework.github.io/ebony/
# Se lance à chaque changement de la documentation sur main, ou à la main (Actions > Documentation > Run workflow).
# Ne s'exécute QUE sur le dépôt public ebonyframework/ebony : le dépôt de développement (privé) a le même fichier et l'ignore.
# Réglage à faire une fois sur le dépôt public : Settings > Pages > Source = « GitHub Actions ».
name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; un déploiement en cours n'est pas interrompu.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'ebonyframework/ebony'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Installer VitePress
        run: npm ci
        working-directory: docs
      # Un lien mort ou une page absente fait échouer cette étape (ignoreDeadLinks: false dans la configuration).
      - name: Construire le site
        run: npm run build
        working-directory: docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.repository == 'ebonyframework/ebony'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
